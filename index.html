<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>reveal.js</title>

	<!-- <link rel="stylesheet" href="dist/reset.css"> -->
	<link rel="stylesheet" href="dist/reveal.css">
	<!-- <link rel="stylesheet" href="dist/theme/black.css"> -->

	<!-- Theme used for syntax highlighted code -->
	<!-- <link rel="stylesheet" href="plugin/highlight/monokai.css"> -->
	<!-- <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->

	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Noto+Serif:wght@700&display=swap"
		rel="stylesheet">

	<!-- Styles -->
	<link rel="stylesheet" href="examples/aivision/aivision2.css">
</head>

<body>
	<div class="reveal">
		<div class="slides">
			<section>Slide 1</section>
			<section>Slide 2</section>
			<section>
				<section>Slide 3.1</section>
				<section>Slide 3.2</section>
			</section>
			<section>
				<div class="aislide">

					<!-- HEADER -->
					<h1 class="slide-row-header slide-title">
						Big img à gauche
					</h1>

					<!-- CONTENT -->
					<div class="slide-row-content grid-2cols-big-left">

							<div class="grid-col=1/2">
								<p>GAUCHE</p>
								<!-- <img src="https://images.pexels.com/photos/31527637/pexels-photo-31527637.jpeg" alt=""> -->
							</div>

							<div class="grid-col=2/3">
								<p>DROITE</p>
								<!-- <div class="subtitle">
									Avec un sous-titre plus petit
								</div>

								<div class="body-text">
									Texte volontairement long pour illustrer le clamp.
									S’il dépasse, il est coupé proprement sans casser le footer.
								</div> -->
							</div>

					</div>


					<!-- FOOTER -->
					<div class="slide-row-footer slide-footer">
						<img src="https://ai-vision.fr/wp-content/uploads/2025/12/Iris_mauve_7C3AED_500x500.svg" alt="">
						<div class="line"></div>
						<img src="https://ai-vision.fr/wp-content/uploads/2025/12/Logo_20271011_no_txt.svg" alt="">
					</div>
				</div>
			</section>



		</div>
	</div>

	<script src="dist/reveal.js"></script>
	<script src="plugin/notes/notes.js"></script>
	<script src="plugin/markdown/markdown.js"></script>
	<script src="plugin/highlight/highlight.js"></script>
	<script>
		// More info about initialization & config:
		// - https://revealjs.com/initialization/
		// - https://revealjs.com/config/
		Reveal.initialize({
			hash: true,
			width: 1280,
			height: 720,

			// Learn about plugins: https://revealjs.com/plugins/
			plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
		});
	</script>
</body>

</html>
